name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Compile
        shell: msys2 {0}
        run: g++ -std=c++17 -O2 -Wall -static -static-libgcc -static-libstdc++ main.cpp -o BuskuTravel.exe

      - uses: actions/upload-artifact@v4
        with:
          name: BuskuTravel-windows
          path: BuskuTravel.exe
